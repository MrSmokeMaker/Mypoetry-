<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поэтический блокнот</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Lora', 'Georgia', 'serif'],
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .poem-font { font-family: 'Lora', Georgia, serif; }
        .glass { background: rgba(18, 24, 38, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .glass-light { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Canvas Background Animation -->
    <canvas id="bgCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- Main Container -->
    <div id="app" class="relative z-10 flex flex-col min-h-screen max-w-3xl mx-auto px-4 py-6">

        <!-- Header / Navigation -->
        <header class="flex items-center justify-between pb-6 border-b border-slate-800/60 mb-6">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('library')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">Мои СтихИ</h1>
                    <p class="text-xs text-slate-400">Личный поэтический сборник</p>
                </div>
            </div>

            <!-- Nav Actions -->
            <div class="flex items-center space-x-2">
                <button onclick="switchTab('library')" id="nav-btn-library" class="px-3 py-1.5 rounded-lg text-sm font-medium transition bg-indigo-600 text-white shadow-md shadow-indigo-600/30">Библиотека</button>
                <button onclick="switchTab('editor')" id="nav-btn-editor" class="px-3 py-1.5 rounded-lg text-sm font-medium transition text-slate-300 hover:bg-slate-800/60">+ Новый</button>
                <button onclick="openSettingsModal()" class="p-2 rounded-lg text-slate-400 hover:bg-slate-800/60 hover:text-white transition" title="Настройки и бэкап">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                </button>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main class="flex-1 pb-12">

            <!-- TAB: LIBRARY -->
            <div id="tab-library" class="space-y-6">
                <!-- Search & Filters -->
                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <svg class="absolute left-3.5 top-3 w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        <input type="text" id="searchInput" oninput="renderPoems()" placeholder="Поиск по названию или тексту..." class="w-full bg-slate-900/60 border border-slate-800 rounded-xl pl-10 pr-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition placeholder:text-slate-500">
                    </div>
                    <select id="tagFilter" onchange="renderPoems()" class="bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition text-slate-300">
                        <option value="">Все теги</option>
                        <option value="VK">VK</option>
                        <option value="Лирика">Лирика</option>
                        <option value="Философия">Философия</option>
                        <option value="Город">Город</option>
                    </select>
                </div>

                <!-- Poems Grid -->
                <div id="poemsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Dynamic Items -->
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="hidden text-center py-16">
                    <div class="w-16 h-16 bg-slate-900 border border-slate-800 rounded-2xl flex items-center justify-center mx-auto mb-4 text-slate-500">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
                    </div>
                    <h3 class="text-base font-medium text-slate-300">Стихов пока нет</h3>
                    <p class="text-sm text-slate-500 mt-1 mb-6">Добавьте первое стихотворение или импортируйте бэкап</p>
                    <button onclick="switchTab('editor')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/30">Написать стих</button>
                </div>
            </div>

            <!-- TAB: EDITOR -->
            <div id="tab-editor" class="hidden space-y-4 max-w-xl mx-auto">
                <input type="hidden" id="editPoemId">
                <div class="flex items-center justify-between">
                    <h2 id="editorTitle" class="text-lg font-semibold text-slate-200">Новое стихотворение</h2>
                    <button onclick="switchTab('library')" class="text-sm text-slate-400 hover:text-white">Отмена</button>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Название</label>
                    <input type="text" id="poemTitle" placeholder="Например: Осенний вечер..." class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Тег / Сборник</label>
                        <input type="text" id="poemTag" placeholder="Лирика, VK..." class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Дата</label>
                        <input type="date" id="poemDate" class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition text-slate-300">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Ссылка на картинку (опционально)</label>
                    <input type="url" id="poemImage" placeholder="https://..." class="w-full bg-slate-900/60 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Текст стихотворения</label>
                    <textarea id="poemContent" rows="10" placeholder="Введите текст, сохраняя строфы..." class="w-full bg-slate-900/60 border border-slate-800 rounded-xl p-4 text-sm poem-font leading-relaxed focus:outline-none focus:border-indigo-500 transition"></textarea>
                </div>

                <button onclick="savePoem()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/30">Сохранить стихотворение</button>
            </div>

            <!-- TAB: VIEWER -->
            <div id="tab-viewer" class="hidden space-y-6 max-w-xl mx-auto">
                <div class="flex items-center justify-between">
                    <button onclick="switchTab('library')" class="inline-flex items-center text-sm text-slate-400 hover:text-white transition">
                        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                        Назад к списку
                    </button>
                    <div class="flex items-center space-x-2">
                        <button onclick="editCurrentPoem()" class="p-2 bg-slate-900 border border-slate-800 rounded-lg text-slate-300 hover:bg-slate-800 transition" title="Редактировать">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </button>
                        <button onclick="deleteCurrentPoem()" class="p-2 bg-slate-900 border border-slate-800 rounded-lg text-rose-400 hover:bg-rose-950/40 transition" title="Удалить">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>

                <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-6 sm:p-8 backdrop-blur-sm space-y-6">
                    <div class="text-center space-y-2">
                        <span id="viewPoemTag" class="inline-block px-3 py-1 rounded-full text-xs font-medium bg-indigo-500/10 text-indigo-400 border border-indigo-500/20"></span>
                        <h2 id="viewPoemTitle" class="text-2xl font-bold font-serif text-slate-100"></h2>
                        <p id="viewPoemDate" class="text-xs text-slate-500"></p>
                    </div>

                    <div id="viewPoemImageContainer" class="hidden rounded-xl overflow-hidden max-h-80 border border-slate-800">
                        <img id="viewPoemImage" src="" alt="" class="w-full h-full object-cover">
                    </div>

                    <div id="viewPoemContent" class="poem-font text-base sm:text-lg leading-loose text-slate-200 whitespace-pre-line text-center"></div>
                </div>
            </div>

        </main>
    </div>

    <!-- SETTINGS & BACKUP MODAL -->
    <div id="settingsModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-6 shadow-2xl">
            <div class="flex items-center justify-between">
                <h3 class="text-lg font-semibold text-slate-100">Резервная копия и VK</h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white">✕</button>
            </div>
            
            <div class="space-y-4">
                <p class="text-xs text-slate-400">Экспортируй стихи в файл или загрузи JSON-файл с перенесенными стихами.</p>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="exportBackup()" class="py-2.5 px-4 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-sm font-medium transition flex items-center justify-center space-x-2">
                        <span>Экспорт JSON</span>
                    </button>
                    <label class="py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-sm font-medium transition flex items-center justify-center space-x-2 cursor-pointer shadow-lg shadow-indigo-600/20">
                        <span>Импорт JSON</span>
                        <input type="file" accept=".json" onchange="importBackup(event)" class="hidden">
                    </label>
                </div>
            </div>

            <div class="pt-4 border-t border-slate-800">
                <button onclick="loadSamplePoems()" class="w-full py-2.5 bg-slate-800/50 hover:bg-slate-800 text-slate-300 rounded-xl text-sm font-medium transition">Загрузить тестовые стихи</button>
            </div>
        </div>
    </div>

    <!-- App Logic -->
    <script>
        // Background Canvas Animation
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5 + 0.5,
                color: Math.random() > 0.5 ? 'rgba(99, 102, 241, 0.4)' : 'rgba(139, 92, 246, 0.4)',
                speedY: (Math.random() - 0.5) * 0.2,
                speedX: (Math.random() - 0.5) * 0.2
            });
        }

        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            });
            requestAnimationFrame(animateBg);
        }
        animateBg();

        // Application State
        let poems = JSON.parse(localStorage.getItem('poems_data') || '[]');
        let currentPoemId = null;

        function saveToStorage() {
            localStorage.setItem('poems_data', JSON.stringify(poems));
        }

        function switchTab(tabName) {
            ['library', 'editor', 'viewer'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
            });
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            document.getElementById('nav-btn-library').className = tabName === 'library' 
                ? 'px-3 py-1.5 rounded-lg text-sm font-medium transition bg-indigo-600 text-white shadow-md shadow-indigo-600/30'
                : 'px-3 py-1.5 rounded-lg text-sm font-medium transition text-slate-300 hover:bg-slate-800/60';

            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (tabName === 'library') renderPoems();
        }

        function renderPoems() {
            const grid = document.getElementById('poemsGrid');
            const empty = document.getElementById('emptyState');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const tagFilter = document.getElementById('tagFilter').value;

            const filtered = poems.filter(p => {
                const matchesQuery = p.title.toLowerCase().includes(query) || p.content.toLowerCase().includes(query);
                const matchesTag = !tagFilter || p.tag === tagFilter;
                return matchesQuery && matchesTag;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            grid.innerHTML = filtered.map(p => `
                <div onclick="viewPoem('${p.id}')" class="bg-slate-900/60 border border-slate-800 hover:border-slate-700 p-5 rounded-2xl cursor-pointer transition flex flex-col justify-between space-y-4 group">
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs px-2.5 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">${p.tag || 'Лирика'}</span>
                            <span class="text-xs text-slate-500">${p.date || ''}</span>
                        </div>
                        <h3 class="text-base font-semibold font-serif text-slate-100 group-hover:text-indigo-300 transition">${p.title}</h3>
                        <p class="text-sm text-slate-400 poem-font line-clamp-3 mt-2">${p.content}</p>
                    </div>
                    ${p.image ? `<div class="h-32 rounded-lg overflow-hidden border border-slate-800"><img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500"></div>` : ''}
                </div>
            `).join('');
        }

        function viewPoem(id) {
            const p = poems.find(x => x.id === id);
            if (!p) return;
            currentPoemId = id;

            document.getElementById('viewPoemTitle').innerText = p.title;
            document.getElementById('viewPoemTag').innerText = p.tag || 'Лирика';
            document.getElementById('viewPoemDate').innerText = p.date || '';
            document.getElementById('viewPoemContent').innerText = p.content;

            const imgContainer = document.getElementById('viewPoemImageContainer');
            const imgEl = document.getElementById('viewPoemImage');
            if (p.image) {
                imgEl.src = p.image;
                imgContainer.classList.remove('hidden');
            } else {
                imgContainer.classList.add('hidden');
            }

            switchTab('viewer');
        }

        function savePoem() {
            const id = document.getElementById('editPoemId').value || 'poem_' + Date.now();
            const title = document.getElementById('poemTitle').value.trim() || 'Без названия';
            const tag = document.getElementById('poemTag').value.trim() || 'Лирика';
            const date = document.getElementById('poemDate').value || new Date().toISOString().split('T')[0];
            const image = document.getElementById('poemImage').value.trim();
            const content = document.getElementById('poemContent').value.trim();

            if (!content) {
                alert('Введите текст стихотворения');
                return;
            }

            const index = poems.findIndex(x => x.id === id);
            const newPoem = { id, title, tag, date, image, content };

            if (index >= 0) {
                poems[index] = newPoem;
            } else {
                poems.unshift(newPoem);
            }

            saveToStorage();
            document.getElementById('editPoemId').value = '';
            document.getElementById('poemTitle').value = '';
            document.getElementById('poemTag').value = '';
            document.getElementById('poemImage').value = '';
            document.getElementById('poemContent').value = '';
            switchTab('library');
        }

        function editCurrentPoem() {
            const p = poems.find(x => x.id === currentPoemId);
            if (!p) return;

            document.getElementById('editPoemId').value = p.id;
            document.getElementById('poemTitle').value = p.title;
            document.getElementById('poemTag').value = p.tag;
            document.getElementById('poemDate').value = p.date;
            document.getElementById('poemImage').value = p.image || '';
            document.getElementById('poemContent').value = p.content;
            document.getElementById('editorTitle').innerText = 'Редактировать стихотворение';

            switchTab('editor');
        }

        function deleteCurrentPoem() {
            if (confirm('Удалить это стихотворение?')) {
                poems = poems.filter(x => x.id !== currentPoemId);
                saveToStorage();
                switchTab('library');
            }
        }

        function openSettingsModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
        function closeSettingsModal() { document.getElementById('settingsModal').classList.add('hidden'); }

        function exportBackup() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(poems, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "poetry_backup.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        poems = imported;
                        saveToStorage();
                        renderPoems();
                        closeSettingsModal();
                        alert(`Успешно импортировано стихов: ${poems.length}`);
                    }
                } catch (err) {
                    alert('Ошибка чтения файла бэкапа');
                }
            };
            reader.readAsText(file);
        }

        function loadSamplePoems() {
            poems = [
                {
                    id: 'sample_1',
                    title: 'Осенний вечер',
                    tag: 'Лирика',
                    date: '2026-10-12',
                    image: '',
                    content: 'Листва кружится над аллеей,\nИ дождь стучит в ночное стекло.\nМы стали чуточку взрослее,\nИ то, что было — уплыло.'
                }
            ];
            saveToStorage();
            renderPoems();
            closeSettingsModal();
        }

        // Init
        document.getElementById('poemDate').value = new Date().toISOString().split('T')[0];
        renderPoems();
    </script>
</body>
</html>
